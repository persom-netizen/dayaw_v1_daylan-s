name: dayaw
description: "A new Flutter project."
publish_to: 'none' # Remove if publishing

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  http: ^0.13.6
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  http_parser: ^4.1.2
  crop_your_image: ^1.0.6
  image: ^4.0.17

  # on-device scan logging for field testing (no backend needed)
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The section below is where the indentation matters most!
flutter:
  uses-material-design: true

  assets:
    - assets/images/dayawlogo.png
    - assets/tagalog_words.txt


  fonts:
    - family: BaybayinCustom
      fonts:
        - asset: assets/fonts/baybayin_custom.ttf  # ⚠️ your ttf filename